name: Postgres image

# Publishes the meritum-postgres image (platform/postgres/) to GHCR for docker
# compose, the team server and GCP. The tag pins the pgvector/PG base and the
# commit, e.g. 0.8.7-pg18-1a2b3c4; there is no `latest`. Built for amd64 and
# arm64 (dellpromaxgb10 is ARM64). The image test (postgres/test.sh) stays a
# local script, outside pull request CI.
on:
  push:
    branches: [main]
    paths: ["onprem/dellpromaxgb10/platform/postgres/**", ".github/workflows/postgres-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: postgres-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag
        id: tag
        run: |
          base=$(sed -n 's/^FROM pgvector\/pgvector:\([^ ]*\)-trixie$/\1/p' onprem/dellpromaxgb10/platform/postgres/Dockerfile)
          test -n "$base"
          echo "image=ghcr.io/meritum-hacknation2026/meritum-postgres:$base-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: onprem/dellpromaxgb10/platform/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
      - run: echo "Published ${{ steps.tag.outputs.image }}" >>"$GITHUB_STEP_SUMMARY"
