name: Platform (dellpromaxgb10)

# Shared Meritum platform on dellpromaxgb10: network, PostgreSQL (schema app_<env>
# and database meritum_dbos_<env> per env), GCP workload identity certificates and credential
# files of the api and worker, env files for the app deploys, the static file host
# meritum-static, meritum-gateway and the Cloudflare tunnel routes of the meritum hosts.
# Idempotent. Runs on a change to the platform files on main, or by hand.
on:
  push:
    branches: [main]
    paths: ["onprem/dellpromaxgb10/platform/**", ".github/workflows/platform.yml"]
  workflow_dispatch:
  # Monthly: renews the GCP workload certificates 30 days before they expire (wif.sh).
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: platform
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, dellpromaxgb10]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      MERITUM_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      MERITUM_GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      MERITUM_ADMIN_EMAILS_DEV: ${{ secrets.MERITUM_ADMIN_EMAILS_DEV }}
      MERITUM_ADMIN_EMAILS_PRD: ${{ secrets.MERITUM_ADMIN_EMAILS_PRD }}
      MERITUM_FACT_CHECK_API_KEY_DEV: ${{ secrets.MERITUM_FACT_CHECK_API_KEY_DEV }}
      MERITUM_FACT_CHECK_API_KEY_PRD: ${{ secrets.MERITUM_FACT_CHECK_API_KEY_PRD }}
      # Pinned corpus snapshot of search_corpus (infra#57); unset skips the step.
      MERITUM_CORPUS_VERSION_DEV: ${{ vars.MERITUM_CORPUS_VERSION_DEV }}
      MERITUM_CORPUS_VERSION_PRD: ${{ vars.MERITUM_CORPUS_VERSION_PRD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: onprem/dellpromaxgb10/platform/setup.sh
