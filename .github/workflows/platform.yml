name: Platform (dellpromaxgb10)

# Shared Meritum platform on dellpromaxgb10: network, PostgreSQL (schema app_<env>
# and database meritum_dbos_<env> per env), env files for the app deploys, meritum-gateway and the
# Cloudflare tunnel routes of meritum.gburek.app and meritum-dev.gburek.app.
# Idempotent. Runs on a change to the platform files on main, or by hand.
on:
  push:
    branches: [main]
    paths: ["onprem/dellpromaxgb10/platform/**", ".github/workflows/platform.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, dellpromaxgb10]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: onprem/dellpromaxgb10/platform/setup.sh
