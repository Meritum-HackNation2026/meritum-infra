name: Terraform

# fmt, validate and plan-only tests (mock provider, no credentials) of every
# module in gcp/, plus shellcheck of its scripts. `terraform apply` stays manual (scripts/apply.sh, README).
on:
  pull_request:
    paths: ["gcp/**", "onprem/dellpromaxgb10/platform/*.sh", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["gcp/**", "onprem/dellpromaxgb10/platform/*.sh", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [gcp/app, gcp/gh-actions, gcp/state, gcp/storage, gcp/workload-identity]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: if [ -d tests ]; then terraform test; fi
      - name: shellcheck
        working-directory: .
        run: |
          shopt -s nullglob
          scripts=(${{ matrix.module }}/*.sh)
          if [ ${#scripts[@]} -gt 0 ]; then shellcheck -x "${scripts[@]}"; fi
