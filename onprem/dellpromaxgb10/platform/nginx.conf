# meritum-gateway: routes the public Meritum hostnames to containers on the
# private `meritum` network: the web app (meritum-frontend's nginx, which
# proxies /api to the API), the platform mocks and the static file host
# (meritum-static, static.nginx.conf). Unknown hosts get 404.
worker_processes 1;
events { worker_connections 512; }

http {
    # Docker DNS at request time: a missing container is a 502, never a crash.
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;

    map $host $meritum_upstream {
        meritum.gburek.app      meritum-web-prd:8080;
        meritum-dev.gburek.app  meritum-web-dev:8080;
        ~^meritum-(x|facebook|instagram|reddit|tiktok|discord)(-dev)?\.gburek\.app$      meritum-mocks-prd:3000;
        meritum-static.gburek.app  meritum-static:8080;
        default                 "";
    }

    # Cloudflare's view of the client, else the socket peer; replaces any
    # X-Forwarded-For the client sent.
    map $http_cf_connecting_ip $meritum_client_ip {
        default $http_cf_connecting_ip;
        ""      $remote_addr;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            if ($meritum_upstream = "") { return 404; }
            proxy_pass http://$meritum_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Connecting-IP $meritum_client_ip;
            proxy_set_header X-Forwarded-For $meritum_client_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
