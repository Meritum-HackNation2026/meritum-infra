# meritum-static: serves the host directory M_STATIC_DIR (mounted read-only at
# /srv/static) at meritum-static.gburek.app, behind meritum-gateway. Published
# materials only: nothing is uploaded or executed here. Runs as the directory's
# owner on a read-only root filesystem, so every writable path is in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Office files download under the file name from the URL instead of opening as a blob.
    map $uri $static_disposition {
        ~*\.(xlsx|pptx)$  attachment;
        default           "";
    }

    server {
        listen 8080;
        root /srv/static;
        index index.html;
        # /folder -> /folder/ as a relative Location: the public host is the gateway's, not ours.
        absolute_redirect off;

        # Files get replaced under the same name and the Cloudflare zone gives browsers a
        # 4 h cache when the origin is silent. no-cache means "revalidate every time":
        # an unchanged file costs one 304 (ETag), a replaced one shows up at once.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition $static_disposition;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # No directory listing: a folder is visible only through its own index.html.
        error_page 403 =404 @missing;
        location @missing { return 404; }
        location ~ /\. { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
